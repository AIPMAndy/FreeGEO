name: Release gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check app.js && node --check core.js && node --check growth.js && node --check workflow.js && node --check projects.js && node --test tests/*.test.js
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node cli.js validate examples/demo.json && node cli.js validate examples/pilots/personal.json && node cli.js validate examples/pilots/company.json && node cli.js report examples/demo.json > /tmp/demo-report.md
      - run: python site_doctor.py --file index.html --json > /tmp/site-preflight.json
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_dom.py
      - run: python tests/browser_smoke.py
